services:
  chat-kafka:
    image: bitnami/kafka:3.9
    restart: always
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@chat-kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://chat-kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - chat
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  chat-server-1-kafka:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - CHAT_WS_PORT=8080
      - MONGO_DB_HOST=chat-mongo
      - MONGO_DB_PORT=27017
      - MONGO_DB_USERNAME=chat_user
      - MONGO_DB_PASSWORD=chat_password
      - CHAT_DB=chat_db
      - MAIN_DB=main_db
      - REDIS_ADDR=chat-redis:6379
      - REDIS_PASSWORD=
      - GATEWAY_URL=http://gateway:8000
      - MOCK_USERS_ENABLED=1
      - MOCK_USERS_FILE=/root/config/mock_users.json
      - RABBITMQ_ENABLED=false
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=chat-kafka:9092
      - KAFKA_MESSAGES_TOPIC=chat.messages
      - KAFKA_CONSUMER_GROUP=chat-writers
    volumes:
      - ./config:/root/config
    depends_on:
      chat-mongo:
        condition: service_healthy
      chat-redis:
        condition: service_healthy
      chat-kafka:
        condition: service_healthy
    networks:
      - chat

  chat-server-2-kafka:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - CHAT_WS_PORT=8080
      - MONGO_DB_HOST=chat-mongo
      - MONGO_DB_PORT=27017
      - MONGO_DB_USERNAME=chat_user
      - MONGO_DB_PASSWORD=chat_password
      - CHAT_DB=chat_db
      - MAIN_DB=main_db
      - REDIS_ADDR=chat-redis:6379
      - REDIS_PASSWORD=
      - GATEWAY_URL=http://gateway:8000
      - MOCK_USERS_ENABLED=1
      - MOCK_USERS_FILE=/root/config/mock_users.json
      - RABBITMQ_ENABLED=false
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=chat-kafka:9092
      - KAFKA_MESSAGES_TOPIC=chat.messages
      - KAFKA_CONSUMER_GROUP=chat-writers
    volumes:
      - ./config:/root/config
    depends_on:
      chat-mongo:
        condition: service_healthy
      chat-redis:
        condition: service_healthy
      chat-kafka:
        condition: service_healthy
    networks:
      - chat

  chat-server-3-kafka:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - CHAT_WS_PORT=8080
      - MONGO_DB_HOST=chat-mongo
      - MONGO_DB_PORT=27017
      - MONGO_DB_USERNAME=chat_user
      - MONGO_DB_PASSWORD=chat_password
      - CHAT_DB=chat_db
      - MAIN_DB=main_db
      - REDIS_ADDR=chat-redis:6379
      - REDIS_PASSWORD=
      - GATEWAY_URL=http://gateway:8000
      - MOCK_USERS_ENABLED=1
      - MOCK_USERS_FILE=/root/config/mock_users.json
      - RABBITMQ_ENABLED=false
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=chat-kafka:9092
      - KAFKA_MESSAGES_TOPIC=chat.messages
      - KAFKA_CONSUMER_GROUP=chat-writers
    volumes:
      - ./config:/root/config
    depends_on:
      chat-mongo:
        condition: service_healthy
      chat-redis:
        condition: service_healthy
      chat-kafka:
        condition: service_healthy
    networks:
      - chat

  chat-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8888:80"
    depends_on:
      - chat-mongo
      - chat-redis
      - chat-kafka
      - chat-server-1
      - chat-server-1-kafka
      - chat-server-2
      - chat-server-3
    networks:
      - chat

networks:
  chat:
    driver: bridge
