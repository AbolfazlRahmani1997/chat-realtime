apiVersion: v1
kind: Namespace
metadata:
  name: chat-shanakht
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: chat-shanakht
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: chat-shanakht
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-shanakht
  namespace: chat-shanakht
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-shanakht
  template:
    metadata:
      labels:
        app: chat-shanakht
    spec:
      containers:
        - name: app
          image: registry.meetpeet.ir/chat-shanakht-app:latest
          command: ["./app"]
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: chat-env
          env:
            - name: ENVIRONMENT
              value: "production"
      imagePullSecrets:
        - name: regcred
---
apiVersion: v1
kind: Service
metadata:
  name: chat-shanakht
  namespace: chat-shanakht
spec:
  selector:
    app: chat-shanakht
  ports:
    - port: 8888
      targetPort: 8888
  type: NodePort
  sessionAffinity: ClientIP
